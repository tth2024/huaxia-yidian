```yaml
name: 部署到 GitHub Pages

on:
  # 每次推送到 main 分支时自动触发部署
  push:
    branches: [main]

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖
      - name: 安装依赖
        run: npm ci

      # 4. 构建项目
      - name: 构建项目
        run: npm run build

      # 5. 设置 GitHub Pages
      - name: 设置 Pages
        uses: actions/configure-pages@v4

      # 6. 上传构建产物
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 7. 部署到 GitHub Pages
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
```
